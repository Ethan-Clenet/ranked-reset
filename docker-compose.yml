services:
  db:
    image: postgres:16-alpine
    container_name: ranked-reset-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ranked
      POSTGRES_PASSWORD: ranked123
      POSTGRES_DB: ranked_reset
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ranked-reset-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://ranked:ranked123@db:5432/ranked_reset?schema=public"
    depends_on:
      - db

volumes:
  pgdata:
